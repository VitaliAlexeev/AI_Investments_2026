<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture 9 playground: Can this explanation be defended?</title>
<style>:root{--navy:#123F69;--blue:#2E75B6;--orange:#E8820C;--red:#C00000;--grey:#8C8C8C;--band:#E2EBF4;
--ink:#1E2B38;--muted:#5D6B79;--rule:#D3DCE6;--paper:#FBFCFD;--panel:#F1F5F9;
--serif:Charter,"Bitstream Charter","Sitka Text",Cambria,"Iowan Old Style",Georgia,serif;
--sans:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.55}
button,input,select{font-family:var(--sans);font-size:.88rem}
.app{display:grid;grid-template-columns:258px 1fr;min-height:100vh}
.rail{background:var(--navy);color:#fff;padding:1.4rem 1rem 2rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail .brand{font-family:var(--sans);font-size:.82rem;opacity:.85;margin:0 .4rem 1.2rem;line-height:1.35}
.rail .brand b{display:block;font-size:1.05rem;opacity:1;font-family:var(--serif);font-weight:600;margin-bottom:.2rem}
.rail h3{font-family:var(--sans);font-weight:600;font-size:.78rem;opacity:.7;margin:1.1rem .4rem .35rem}
.rail a{display:grid;grid-template-columns:1.6rem 1fr;gap:.2rem;color:#fff;text-decoration:none;padding:.42rem .4rem;border-radius:4px;font-family:var(--sans);font-size:.86rem;line-height:1.3}
.rail a .n{opacity:.65;font-variant-numeric:tabular-nums}
.rail a:hover{background:rgba(255,255,255,.08)}
.rail a.on{background:#fff;color:var(--navy)}
.rail a.on .n{opacity:1}
.rail a.seen:not(.on) .n::after{content:" \2713";font-size:.75rem}
main{padding:2.2rem 3rem 4rem;max-width:1120px}
.kicker{font-family:var(--sans);color:var(--muted);font-size:.85rem;margin:0 0 .3rem}
h1{font-size:2.15rem;line-height:1.15;margin:0 0 .4rem;color:var(--navy);font-weight:600}
h2{font-size:1.45rem;margin:2rem 0 .6rem;color:var(--navy);font-weight:600}
.lede{font-size:1.12rem;max-width:44rem;margin:.2rem 0 1.4rem}
p{max-width:44rem}
.predict{border-left:4px solid var(--orange);background:#FFF8F0;padding:.9rem 1.1rem;margin:1.2rem 0 1.6rem;max-width:46rem}
.predict .q{margin:0 0 .6rem}
.predict .opts{display:flex;flex-wrap:wrap;gap:.5rem}
.predict .verdict{margin:.7rem 0 0}
.predict .verdict b{color:var(--navy)}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);padding:.42rem .8rem;border-radius:4px;cursor:pointer}
.btn:hover{background:var(--band)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:#0d2f50}
.btn.picked{background:var(--navy);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.instrument{display:grid;grid-template-columns:minmax(220px,290px) 1fr;gap:1.4rem;background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:1.1rem 1.2rem;margin:.6rem 0 1rem}
.instrument.wide{grid-template-columns:1fr}
.controls{font-family:var(--sans);font-size:.88rem}
.controls .group{margin:0 0 1rem}
.controls label.cap{display:block;font-weight:600;color:var(--navy);margin:0 0 .3rem}
.controls .row{display:flex;align-items:center;gap:.5rem;margin:.25rem 0}
.controls input[type=range]{width:100%;accent-color:var(--navy)}
.controls .val{font-variant-numeric:tabular-nums;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:.3rem}
.seg button{border:1px solid var(--rule);background:#fff;color:var(--ink);padding:.32rem .6rem;border-radius:3px;cursor:pointer}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.charts{min-width:0}
.charts svg{display:block;max-width:100%;height:auto;font-family:var(--sans)}
.finding{font-size:1.18rem;line-height:1.45;border-left:4px solid var(--navy);padding:.2rem 0 .2rem 1rem;margin:1.2rem 0 1.6rem;max-width:46rem}
.finding b{font-variant-numeric:tabular-nums}
.readouts{display:flex;flex-wrap:wrap;gap:.6rem 1.6rem;font-family:var(--sans);font-size:.86rem;margin:.6rem 0 0}
.readouts div b{display:block;font-size:1.25rem;color:var(--navy);font-variant-numeric:tabular-nums}
details{max-width:46rem;border-top:1px solid var(--rule);padding:.55rem 0}
details summary{cursor:pointer;font-family:var(--sans);font-weight:600;color:var(--navy);font-size:.92rem}
details .body{padding:.5rem 0 .2rem}
.try{margin:.4rem 0}
.formula{font-family:var(--serif);font-style:italic;background:#fff;border:1px solid var(--rule);padding:.5rem .8rem;display:inline-block}
.signs{font-family:var(--sans);font-size:.85rem;color:var(--muted);margin:1.6rem 0 0;max-width:46rem}
.signs b{color:var(--ink);font-weight:600}
.pager{display:flex;justify-content:space-between;margin:2rem 0 0;max-width:46rem}
table.t{border-collapse:collapse;font-family:var(--sans);font-size:.84rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:.28rem .6rem;text-align:right;border-bottom:1px solid var(--rule)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--navy);font-weight:600}
table.t tr.hl td{background:#FFF1E2}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.8rem;margin:1rem 0}
.card{background:#fff;border:1px solid var(--rule);border-top:3px solid var(--navy);padding:.7rem .9rem;font-size:.95rem}
.card.pass{border-top-color:var(--blue)} .card.fail{border-top-color:var(--orange)}
.card h4{margin:0 0 .3rem;font-family:var(--sans);font-size:.85rem;color:var(--navy)}
.tag{font-family:var(--sans);font-size:.78rem;padding:.08rem .45rem;border-radius:3px;margin-left:.3rem}
.tag.pass{background:#E3EEF8;color:var(--navy)} .tag.fail{background:#FDEBD8;color:#8A4A06}
.hero{margin:1rem 0 2rem;background:#fff;border:1px solid var(--rule);padding:1.2rem 1.4rem}
.hero .big{font-size:1.25rem;max-width:46rem;margin:0 0 .8rem}
.legend{font-family:var(--sans);font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:1rem;margin:.4rem 0}
.legend i{display:inline-block;width:.75rem;height:.75rem;margin-right:.3rem;vertical-align:-1px;border-radius:50%}
.note{font-family:var(--sans);font-size:.8rem;color:var(--muted)}
@media (max-width:860px){.app{grid-template-columns:1fr}.rail{position:static;height:auto}main{padding:1.4rem 1.1rem 3rem}
.instrument{grid-template-columns:1fr}html{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>/* Lecture 9 playground: opening screen and tests 1-3. */

// =================================================================== 1. the Shapley game
const GAMES = {

registerModule({ id: "m1", num: 1, short: "The Shapley game", title: "The Shapley game", question: "who gets the credit?", render(m) {
  const st = { preset: "together", v: GAMES.together.v.slice(), city: "San Francisco" };

  const teamName = k => { if (!real()) return TEAM[k]; const n = names().filter((_, j) => k >> j & 1); return n.length ? n.join(" + ") : "no features"; };
  const show = v => real() ? fmt.money(v) : fmt.int(v);
  const showD = v => real() ? fmt.dk(v) : (v < 0 ? "\u2212" : "") + fmt.int(Math.abs(v));
  function buildEditor() {
    clear(editor);

    for (const k of [0, 1, 2, 4, 3, 5, 6, 7]) {
      const inp = h("input", { type: "number", value: real() ? st.v[k].toFixed(3) : st.v[k], step: real() ? 0.01 : 5,
        "aria-label": teamName(k), style: "width:6.2rem", disabled: real() ? true : null,
        oninput: () => { const x = parseFloat(inp.value); if (!isNaN(x)) { st.v[k] = x; draw(); } } });
      editor.append(h("div", { class: "row" }, h("span", { style: "flex:1" }, teamName(k)), inp));
    }
    if (real()) editor.append(h("p", { class: "note" }, "In $100,000s: each is the model\u2019s average over 100 block groups given these features."));
  }
  function draw() {
    const n = 3, phi = L9.shapley(st.v, n), tab = L9.orderingTable(st.v, n), ax = L9.axioms(st.v, n), nm = names();
    clear(charts);
    const W = 520, H = 150, svg = svgBox(W, H, "Shapley values");
    const mx = Math.max(1e-9, ...phi.map(Math.abs)), sx = lin(-mx, mx, 150, W - 60);
    phi.forEach((p, j) => {
      const y = 22 + j * 40;
      svg.append(txt(140, y + 15, nm[j], { anchor: "end", fill: C.ink, size: 13 }));
      svg.append(s("rect", { x: Math.min(sx(0), sx(p)), y, width: Math.abs(sx(p) - sx(0)), height: 24, fill: p >= 0 ? C.orange : C.blue }));
      svg.append(txt(p >= 0 ? sx(p) + 5 : sx(p) - 5, y + 16, showD(p), { anchor: p >= 0 ? "start" : "end", fill: C.ink, size: 12, weight: 600 }));
    });
    svg.append(s("line", { x1: sx(0), x2: sx(0), y1: 14, y2: H - 8, stroke: C.ink }));
    const rows = tab.map(r => h("tr", null, h("td", null, r.order.map(j => nm[j]).join(" then ")),
      ...[0, 1, 2].map(j => h("td", null, showD(r.contrib[j])))));
    const table = h("table", { class: "t" }, h("tr", null, h("th", null, "Order of arrival"), ...nm.map(x => h("th", null, x))), rows,
      h("tr", { class: "hl" }, h("td", null, "Average: the Shapley value"), ...phi.map(p => h("td", null, showD(p)))));
    const total = st.v[7] - st.v[0], sumPhi = phi.reduce((a, b) => a + b, 0);
    const axl = h("ul", { class: "note" },
      h("li", null, `Efficiency: the shares add to ${showD(sumPhi)}, exactly the ${showD(total)} the full team earns beyond nobody.`),
      h("li", null, ax.symmetric.length ? `Symmetry: ${ax.symmetric.map(([a, b]) => `${nm[a]} and ${nm[b]}`).join(", ")} contribute identically to every team, so their shares are equal.` : "Symmetry: no two players are interchangeable here."),
      h("li", null, ax.dummies.length ? `Dummy: ${ax.dummies.map(j => nm[j]).join(", ")} never changes what a team earns, so receives nothing.` : "Dummy: every player changes some team\u2019s earnings."));

    } else {
      out.innerHTML = `Shapley\u2019s split: A <b>${showD(phi[0])}</b>, B <b>${showD(phi[1])}</b>, C <b>${showD(phi[2])}</b>. Together exactly ${showD(total)}, everything the full team earns beyond what nobody earns.`;
    }

    onchange: k => { st.preset = k; st.v = k === "california" ? bgEntry().v.slice() : GAMES[k].v.slice();
      citySel.el.style.display = k === "california" ? "" : "none"; buildEditor(); draw(); } });
  const combo = h("p", { class: "note" });

    oninput: v => { combo.textContent = `${fmt.int(2 ** v)} teams to evaluate; ${fmt.int(L9.factorial(v))} orders of arrival.${v === 8 ? " The California model has 8 features." : v === 12 ? " The mortgage model has 12." : ""}`; } });

    lede: "A model\u2019s prediction is a payout earned by a team of features. Shapley\u2019s 1953 answer to who earned what: line the players up in every possible order, record what each adds at the moment it arrives, and average.",
    predict: { q: "Two partners earn 60, but only when they work together; alone, each earns nothing. A third person adds 10 to any team. All three together earn 70. How should the 70 be shared?",
      options: ["35, 35 and nothing", "30, 30 and 10", "60, nothing and 10"], answer: 1,
      explain: "The partners split the 60 that only exists when both are present, and the third person\u2019s 10 is entirely theirs. Load \u201cOnly together\u201d and read the orderings table to see why." },
    instrument: h("div", { class: "instrument" }, h("div", { class: "controls" }, presets.el, citySel.el, editor, comb.el, combo), charts),

      { q: "Edit the earnings so that A and B are interchangeable. What happens to their shares?", a: "<p>They become equal. Interchangeable means a team earns the same whether A or B joins it, for every team containing neither. That is the symmetry axiom, and the axioms list updates to confirm it.</p>" },
      { q: "Load the San Francisco block group. In the orderings table, does latitude contribute the same whatever arrives before it?", a: "<p>No. Compare the rows where latitude arrives first with those where it arrives after longitude. The model has learnt location from the two coordinates together, so each one\u2019s contribution depends on whether the other is already known. That dependence is an interaction, and averaging over every order is how Shapley shares its credit. This is also why the two coordinates often receive large contributions of opposite sign.</p>" },
    ],
    maths: "<p>For <i>n</i> players and a value function <i>v</i> giving what each team <i>S</i> earns, player <i>j</i>\u2019s Shapley value is</p><p class='formula'>\u03c6<sub>j</sub> = \u03a3<sub>S \u2286 N\\{j}</sub> |S|! (n \u2212 |S| \u2212 1)! / n! \u00d7 [ v(S \u222a {j}) \u2212 v(S) ]</p><p>The weight is the share of the <i>n</i>! orders of arrival in which exactly the players in <i>S</i> arrive before <i>j</i>, so the formula is the average marginal contribution over all orders. With three players the weights are 1/3 for the empty and the full team and 1/6 for the others. Shapley proved this is the only split satisfying efficiency, symmetry, the dummy rule and additivity.</p><p>In SHAP the players are features, and <i>v</i>(<i>S</i>) is the model\u2019s average prediction when only the features in <i>S</i> are known and the rest are filled in from background data. Exact evaluation needs all 2<sup><i>n</i></sup> teams, which is why the slider\u2019s numbers matter: TreeSHAP and KernelSHAP exist to avoid that cost.</p>",
    lecture: "SHAP, stated honestly.", notebook: "the warm-up, section 4.1, computes the San Francisco block group\u2019s values by hand.",

// =================================================================== 2. compared with whom?
registerModule({ id: "m2", num: 2, short: "Compared with whom?", title: "Compared with whom?", question: "what is an attribution measured against?", render(m) {
  const CP = D.compare, FE = CP.features;

  const charts = h("div", { class: "charts" }), out = finding();
  const entry = () => CP.blockgroups.find(b => b.city === st.city);
  function explain() {

    const bar = (k, a, b, col, label, value) => {

    cum = r.base;
    order.forEach((j, k) => { bar(k + 1, cum, cum + r.phi[j], r.phi[j] >= 0 ? C.orange : C.blue, SHORT[FE[j]], fmt.dk(r.phi[j])); cum += r.phi[j]; });
    bar(FE.length + 1, 0, r.pred, C.navy, "Prediction", fmt.money(r.pred));
    // mini map: the block group and the comparison region
    const G = geo(230), map = svgBox(230, Math.round(G.h), "Where the comparison group is");
    if (CP.boxes[st.bg]) { const [a, b2, c, d] = CP.boxes[st.bg].box; map.append(s("rect", { x: G.x(c), y: G.y(b2), width: G.x(d) - G.x(c), height: G.y(a) - G.y(b2), fill: C.band, stroke: C.blue })); }

    const side = h("div", null, map, h("p", { class: "note", style: "max-width:230px" }, st.bg === "similar" ? `Comparison group: ${r.B.n} block groups whose median income is within $5,000 of this one, anywhere in the state.` : `Comparison group: ${r.B.n} block groups from ${r.B.label}.`));

        h("tr", null, ["Feature", "Coefficient", "This block group", "Comparison average", "Contribution"].map(x => h("th", null, x))),
        FE.map((f, j) => h("tr", null, h("td", null, SHORT[f]), h("td", null, fmt.n(CP.coef[j], 4)), h("td", null, fmt.n(e.x[j], 2)), h("td", null, fmt.n(r.B.mean[j], 2)), h("td", null, fmt.dk(r.phi[j]))))));
    }

  }
  const sf = CP.blockgroups.find(b => b.city === "San Francisco");
  const ctrl = h("div", { class: "controls" },
    select({ label: "Block group nearest to", value: st.city, options: CP.blockgroups.map(b => [b.city, b.city]), onchange: v => { st.city = v; draw(); } }).el,
    seg({ label: "Model", value: st.model, options: [["gbm", "Boosted"], ["lin", "Linear"]], onchange: v => { st.model = v; draw(); } }).el,
    seg({ label: "Compared with", value: st.bg, options: [["all", "All of California"], ["bay", "Bay Area"], ["la", "Los Angeles basin"], ["valley", "Central Valley"], ["similar", "Similar incomes"]], onchange: v => { st.bg = v; draw(); } }).el,
    h("p", { class: "note" }, "Orange pushes the prediction up; blue pulls it down."));

    lede: "A SHAP value says how much a feature moved this prediction away from a baseline: the model\u2019s average over some comparison group. Someone chooses that group. Change it, and watch what moves.",
    predict: { q: `The boosted model values the San Francisco block group at ${fmt.money(sf.pred_gbm)}. If the comparison group changes from all of California to the Bay Area, what happens to that prediction?`,
      options: ["It rises", "It falls", "It stays exactly the same"], answer: 2,
      explain: "The prediction belongs to the model and the block group. The comparison group only sets the baseline the explanation is measured from, so the baseline and every contribution move, and their total moves to match." },
    instrument: h("div", { class: "instrument" }, ctrl, charts), finding: out,
    tries: [
      { q: "With the linear model, compare San Francisco against the Bay Area. Why does latitude\u2019s contribution almost vanish?", a: "<p>For a linear model each contribution is the coefficient times the distance from the comparison average: \u03b2(x \u2212 x\u0304). The Bay Area\u2019s average latitude is close to San Francisco\u2019s, so the distance, and the contribution, are near zero. The coefficient never changed; the question did.</p>" },
      { q: "Pick Fresno and compare \u201cAll of California\u201d with \u201cCentral Valley\u201d. Which version would a lender quote to justify a low valuation?", a: "<p>Against all of California, location pulls Fresno\u2019s value down sharply, which reads like a reason. Against the Central Valley it barely matters. Neither is wrong. The comparison group is a choice, and a defensible explanation states which one was made.</p>" },
      { q: "Choose \u201cSimilar incomes\u201d. What happens to income\u2019s contribution, and why?", a: "<p>It shrinks towards zero. When the comparison group already has this block group\u2019s income, income cannot explain the difference between them, so the credit moves to the features that still differ, mostly location.</p>" },
    ],
    maths: "<p>With a comparison group <i>B</i>, the value of a team of features <i>S</i> is the model\u2019s average over <i>B</i> with the features in <i>S</i> set to this block group\u2019s values:</p><p class='formula'>v<sub>B</sub>(S) = (1/|B|) \u03a3<sub>b \u2208 B</sub> f(x<sub>S</sub>, b<sub>\u2212S</sub>)</p><p>The baseline is v<sub>B</sub>(\u2205), the model\u2019s average over the group, and efficiency forces the contributions to add up to f(x) \u2212 v<sub>B</sub>(\u2205). Changing <i>B</i> changes the baseline and every contribution, never f(x). For a linear model the contributions are exactly \u03b2<sub>j</sub>(x<sub>j</sub> \u2212 x\u0304<sub>B,j</sub>), which makes the dependence on the group visible in the table.</p>",

// =================================================================== 3. averages and individuals
registerModule({ id: "m3", num: 3, short: "Averages and individuals", title: "Averages and individuals", question: "who is the average?", render(m) {
  const MP = D.maps, IC = D.ice;
  const st = { feat: "MedInc", centre: false, layer: "C", mask: false, sel: null, shuffled: 0 };
  const iceBox = h("div"), mapBox = h("div"), out = finding(), rd = h("div", { class: "readouts" });
  const cityOf = k => nearestCity(IC.rows.lat[k], IC.rows.lon[k]);
  function drawIce() {
    clear(iceBox);
    const F = IC.features[st.feat], g = F.grid, cur = F.curves.map(c => st.centre ? c.map(v => v - c[0]) : c);
    const pd = g.map((_, k) => L9.mean(cur.map(c => c[k])));
    const all = cur.flat(), svg = svgBox(400, 300, "ICE lines and partial dependence");

      onclick: () => { st.sel = st.sel === k ? null : k; drawIce(); drawMap(); write(); } })));

    iceBox.append(svg, h("div", { class: "legend" }, h("span", null, h("i", { style: `background:${C.navy}` }), "average: the partial dependence"), h("span", null, h("i", { style: `background:${C.grey}` }), "one block group (click a line)")));
  }
  function drawMap() {
    clear(mapBox);
    const G = geo(360), svg = svgBox(360, Math.round(G.h), "Map of California"), g = s("g"); svg.append(g);
    const pts = MP.points;
    if (st.layer === "A" || st.layer === "D") {

      for (let i = 0; i < pts.lat.length; i++)

    } else if (st.layer === "B") {

      for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
        const lo = GEO.lon0 + (a + 0.5) * dx, la = GEO.lat0 + (b + 0.5) * dy;
        const v = pl.b_lat * (la - pl.mean_lat) + pl.b_lon * (lo - pl.mean_lon);
        g.append(s("rect", { x: G.x(lo - dx / 2), y: G.y(la + dy / 2), width: G.x(lo + dx / 2) - G.x(lo - dx / 2) + 0.4, height: G.y(la - dy / 2) - G.y(la + dy / 2) + 0.4, fill: div(v, 2.5) }));
      }
    } else {
      const pdd = MP.pd, nx = pdd.lons.length, ny = pdd.lats.length;
      for (let r = 0; r < ny; r++) for (let c = 0; c < nx; c++) {
        const lo0 = c ? (pdd.lons[c - 1] + pdd.lons[c]) / 2 : pdd.lons[0], lo1 = c < nx - 1 ? (pdd.lons[c] + pdd.lons[c + 1]) / 2 : pdd.lons[nx - 1];
        const la0 = r ? (pdd.lats[r - 1] + pdd.lats[r]) / 2 : pdd.lats[0], la1 = r < ny - 1 ? (pdd.lats[r] + pdd.lats[r + 1]) / 2 : pdd.lats[ny - 1];
        const hidden = st.mask && pdd.km[r][c] > 25;
        g.append(s("rect", { x: G.x(lo0), y: G.y(la1), width: G.x(lo1) - G.x(lo0) + 0.4, height: G.y(la0) - G.y(la1) + 0.4,

      }
      const mx = pdd.max;
      g.append(s("circle", { cx: G.x(mx.lon), cy: G.y(mx.lat), r: 7, fill: "none", stroke: C.orange, "stroke-width": 2.5 }));
      g.append(txt(G.x(mx.lon) + 10, G.y(mx.lat) - 6, `peak ${fmt.moneyK(mx.z).replace("about ", "")}`, { fill: C.ink, size: 10.5, weight: 600 }));
    }
    outline(g, G, MP.outline);
    cities(g, G, MP.cities, ["San Francisco", "Los Angeles", "San Diego", "Sacramento", "Fresno"]);
    if (st.sel !== null) {
      g.append(s("circle", { cx: G.x(IC.rows.lon[st.sel]), cy: G.y(IC.rows.lat[st.sel]), r: 7, fill: "none", stroke: C.orange, "stroke-width": 3 }));
    }
    const legends = { A: "median house value (dark = dearer)", B: "linear plane: orange dearer, blue cheaper than average", C: "partial dependence (dark = dearer)", D: "SHAP location effect: orange up, blue down" };
    mapBox.append(svg, h("p", { class: "note" }, legends[st.layer]));
  }
  function write() {
    const MPd = MP.pd, share = 100 * MPd.km.flat().filter(v => v > 25).length / MPd.km.flat().length;
    const texts = {
      A: st.shuffled ? `With latitude shuffled, ${fmt.n(MP.shuffle.share_25km, 0)}% of these block groups now sit more than 25 km from anywhere anyone lives, and the model\u2019s R\u00b2 falls from <b>${fmt.n(MP.r2.base, 2)}</b> to <b>${fmt.n(MP.r2.lat_shuffled, 2)}</b>.` : "Every dot is a real block group. The coast and two metropolitan areas are expensive; the Central Valley is not.",

      t += ` The selected block group, near ${cityOf(st.sel)}, moves <b>${fmt.dk(c[c.length - 1] - c[0])}</b> across the range of ${SHORT[st.feat].toLowerCase()}; the average moves ${fmt.dk(pdv[pdv.length - 1] - pdv[0])}.`;

  let anim = null;
  const shuffleBtn = h("button", { class: "btn", type: "button", onclick: () => {
    if (st.layer !== "A") { layerSeg.set("A"); st.layer = "A"; }
    const target = st.shuffled ? 0 : 1, start = st.shuffled, t0 = performance.now();
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    shuffleBtn.textContent = target ? "Put latitude back" : "Shuffle latitude";
    if (anim) cancelAnimationFrame(anim);
    const step = now => { const p = reduce ? 1 : Math.min(1, (now - t0) / 1200); st.shuffled = start + (target - start) * p; drawMap(); if (p < 1) anim = requestAnimationFrame(step); else write(); };
    if (reduce || !window.requestAnimationFrame) { st.shuffled = target; drawMap(); write(); } else anim = requestAnimationFrame(step);
  } }, "Shuffle latitude");
  const layerSeg = seg({ label: "Map", value: st.layer, options: [["A", "A: the data"], ["B", "B: linear plane"], ["C", "C: partial dependence"], ["D", "D: SHAP"]],
    onchange: v => { st.layer = v; if (v !== "A") { st.shuffled = 0; shuffleBtn.textContent = "Shuffle latitude"; } drawMap(); write(); } });
  const ctrl = h("div", { class: "controls" },
    seg({ label: "Lines for", value: st.feat, options: [["MedInc", "Income"], ["AveOccup", "Occupancy"], ["HouseAge", "House age"], ["Latitude", "Latitude"]], onchange: v => { st.feat = v; drawIce(); write(); } }).el,
    check({ label: "Start every line at zero", value: false, onchange: v => { st.centre = v; drawIce(); } }).el,
    layerSeg.el,
    check({ label: "On map C, hide where nobody lives", value: false, onchange: v => { st.mask = v; if (st.layer !== "C") { st.layer = "C"; layerSeg.set("C"); } drawMap(); write(); } }).el,
    h("div", { class: "group" }, shuffleBtn));
  drawIce(); drawMap(); write();
  return frame(m, {
    lede: "Partial dependence shows the model\u2019s average response to one feature. Individual conditional expectation (ICE) lines show each block group\u2019s own response. Both are computed by moving real block groups to values, and places, they never had.",
    predict: { q: `Averaged over every block group, the model\u2019s predicted value peaks at ${fmt.moneyK(MP.pd.max.z)} at one particular pair of coordinates. Where is that peak?`,
      options: ["Downtown San Francisco", "The Malibu coast", "In the Pacific Ocean"], answer: 2,
      explain: "The surface is an average over block groups that have all been moved to the same coordinates, including coordinates where nobody lives. Pushing \u201cfurther south\u201d and \u201cfurther west\u201d beyond the coastline gives the highest value of all: at sea. Choose map C to see it." },
    instrument: h("div", { class: "instrument" }, ctrl, h("div", { class: "charts", style: "display:flex;flex-wrap:wrap;gap:1rem" }, iceBox, mapBox)),
    finding: out,
    tries: [
      { q: "Choose income. Find a thin line that is almost flat. Where is that block group?", a: "<p>A flat line means the model barely responds to this block group\u2019s income, usually because its location already pins the prediction down. The bold average hides such block groups: it describes nobody in particular.</p>" },
      { q: "Compare map B with map D. What can D show that B cannot?", a: "<p>Two separate expensive regions with cheaper land between them. A plane has one direction of steepest rise; the boosted model\u2019s attributions can mark the Bay Area and Los Angeles separately.</p>" },
      { q: "Press \u201cShuffle latitude\u201d. Why does R\u00b2 fall below zero?", a: "<p>Shuffling one coordinate breaks its pairing with the other, so block groups land in the ocean and the desert, and the model is scored on places it has never seen. For correlated features, permutation importance partly measures extrapolation.</p>" },
    ],
    maths: "<p>For feature <i>j</i>, the ICE line of block group <i>i</i> is f(z, x<sub>i,\u2212j</sub>) as z varies, and partial dependence is their average:</p><p class='formula'>PD<sub>j</sub>(z) = (1/n) \u03a3<sub>i</sub> f(z, x<sub>i,\u2212j</sub>)</p><p>The average uses the other features\u2019 marginal distribution, not their distribution given <i>z</i>. When features are correlated, as latitude and longitude are, the average includes combinations that never occur. Map C makes those visible: hide every grid cell more than 25 km from a real block group and over a third of the surface disappears, including its peak. Accumulated local effects (ALE) plots average only local changes within the data, and are the safer choice for correlated features.</p>",
    lecture: "Four questions, four families of method; Four things a SHAP value is not.", notebook: "the warm-up, Parts 7 and 9: the same four maps.",
  });
} });

<script>/* Lecture 9 playground: tests 4-6. */
"use strict";
const card = (title, html, cls) => h("div", { class: "card" + (cls ? " " + cls : "") }, h("h4", null, title), h("div", { html }));
const cross = (x, y, r, col) => s("path", { d: `M${x - r},${y - r}L${x + r},${y + r}M${x - r},${y + r}L${x + r},${y - r}`, stroke: col, "stroke-width": 1.6, fill: "none" });
const jitter = i => ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1;

// =================================================================== 4. what would it take?
registerModule({ id: "m4", num: 4, short: "What would it take?", title: "What would it take?", question: "is there a change that wins approval?", render(m) {
  const W = L9.lendingWorld();
  const st = { app: [0.95, 42], allowL: true, allowD: true, maxL: 0.4, maxD: 20, family: false };
  const charts = h("div", { class: "charts" }), out = finding(), rd = h("div", { class: "readouts" });
  const X0 = 0.45, X1 = 1.15, Y0 = 10, Y1 = 60;
  const desc = (a, b) => {
    const p = [];
    if (Math.abs(b[0] - a[0]) > 1e-9) p.push(`loan-to-value ${fmt.n(a[0], 2)} \u2192 ${fmt.n(b[0], 2)}`);
    if (Math.abs(b[1] - a[1]) > 1e-9) p.push(`debt-to-income ${fmt.n(a[1], 1)}% \u2192 ${fmt.n(b[1], 1)}%`);
    return p.join(" and ") || "no change";
  };
  function solve() {
    const lo = [st.allowL ? Math.max(X0, st.app[0] - st.maxL) : st.app[0], st.allowD ? Math.max(Y0, st.app[1] - st.maxD) : st.app[1]];
    const opts = { allow: [st.allowL ? 1 : 0, st.allowD ? 1 : 0], lo, hi: st.app.slice(), sdv: W.sdv, steps: 120 };
    return { lo, cheap: L9.recourse(st.app, [W.main], opts), robust: st.family ? L9.recourse(st.app, W.family, opts) : null };
  }
  let svg, P;
  function draw() {
    clear(charts);
    svg = svgBox(560, 420, "Applicants by loan-to-value and debt-to-income");
    svg.append(s("defs", null, ["navy", "purple"].map(c => s("marker", { id: "arr-" + c, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" },
      s("path", { d: "M0,0L10,5L0,10z", fill: C[c] })))));
    P = plot(svg, { x: [X0, X1], y: [Y0, Y1], fx: v => fmt.n(v, 1), fy: v => v + "%", xl: "loan-to-value ratio (lower means a bigger deposit)", yl: "debt-to-income" });
    W.X.forEach(x => P.g.append(s("circle", { cx: P.sx(x[0]), cy: P.sy(x[1]), r: 2.2, fill: W.main.predict(x) > 0.5 ? C.orange : C.blue, opacity: 0.35 })));
    const line = (mdl, attrs) => { const [w0, w1, w2] = mdl.w, yv = l => -(w0 + w1 * l) / w2;
      P.g.append(s("line", Object.assign({ x1: P.sx(X0), y1: P.sy(yv(X0)), x2: P.sx(X1), y2: P.sy(yv(X1)) }, attrs))); };
    const clip = s("clipPath", { id: "plotclip" }, s("rect", { x: P.m.l, y: P.m.t, width: P.W - P.m.l - P.m.r, height: P.H - P.m.t - P.m.b }));
    svg.append(clip); P.g.setAttribute("clip-path", "url(#plotclip)");
    if (st.family) W.family.forEach(f => line(f, { stroke: C.purple, "stroke-width": 1, "stroke-dasharray": "4 3", opacity: 0.8 }));
    line(W.main, { stroke: C.ink, "stroke-width": 2.2 });
    const sol = solve();
    P.g.append(s("rect", { x: P.sx(sol.lo[0]), y: P.sy(st.app[1]), width: Math.max(2, P.sx(st.app[0]) - P.sx(sol.lo[0])), height: Math.max(2, P.sy(sol.lo[1]) - P.sy(st.app[1])),
      fill: C.band, opacity: 0.55, stroke: C.navy, "stroke-dasharray": "3 3" }));
    const arrow = (pt, col) => P.g.append(s("line", { x1: P.sx(st.app[0]), y1: P.sy(st.app[1]), x2: P.sx(pt[0]), y2: P.sy(pt[1]), stroke: C[col], "stroke-width": 2.6, "marker-end": `url(#arr-${col})` }));
    if (sol.cheap && sol.cheap.cost > 0) arrow(sol.cheap.point, "navy");
    if (sol.robust && sol.robust.cost > 0) arrow(sol.robust.point, "purple");
    const pApp = W.main.predict(st.app);
    const dot = s("circle", { cx: P.sx(st.app[0]), cy: P.sy(st.app[1]), r: 8, fill: pApp > 0.5 ? C.orange : C.blue, stroke: C.ink, "stroke-width": 2, style: "cursor:grab", tabindex: 0, "aria-label": "The applicant: drag to move" });
    dot.addEventListener("pointerdown", ev => {
      const move = e => { const ctm = svg.getScreenCTM && svg.getScreenCTM(); if (!ctm) return;
        const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(ctm.inverse());
        st.app = [L9.clamp(P.sx.inv(q.x), 0.5, 1.12), L9.clamp(P.sy.inv(q.y), 12, 58)]; sL.set(st.app[0]); sD.set(st.app[1]); draw(); };
      const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); ev.preventDefault();
    });
    P.g.append(dot);
    charts.append(svg, h("div", { class: "legend" },
      h("span", null, h("i", { style: `background:${C.orange}` }), "declined by this model"), h("span", null, h("i", { style: `background:${C.blue}` }), "approved"),
      h("span", null, h("i", { style: `background:${C.band};border:1px dashed ${C.navy};border-radius:0` }), "changes allowed"),
      st.family ? h("span", null, h("i", { style: `background:${C.purple}` }), "ten equally good models") : null));
    // the words

registerModule({ id: "m8", num: 8, short: "Equally good models", title: "Equally good models", question: "which model?", render(m) {

  function draw() {
    const c = cases.find(x => x.pos === st.pos); clear(body); out.innerHTML = "";
    body.append(h("div", { class: "card", style: "max-width:46rem" }, h("h4", null, `Applicant ${c.pos}: the letter as it would be sent`),
      h("p", null, `Your application has been declined. The model put your probability of denial at ${fmt.pct(c.p_ref)}. The principal reasons were: `,
        h("b", null, c.ref_top3.map(label).join("; ")), "."),
      h("p", { class: "note" }, `${grp(c.group)}. In the historical data this application was ${c.actual ? "denied" : "approved"}.`)));
    const ask = h("div", { class: "predict" }, h("p", { class: "q" }, h("b", null, "Your call first. "), "Would you defend this decision, and its stated reasons, to the applicant and to a regulator?"),
      h("div", { class: "opts" }, ["Yes, I would", "No, I would not"].map((t, i) => h("button", { class: "btn" + (st.guess === i ? " picked" : ""), type: "button", onclick: () => { st.guess = i; draw(); } }, t))));
    body.append(ask);
    if (st.guess === null) return;
    const deny = c.q.filter(v => v > 0.5).length, decStable = deny === 10 || deny === 0;
    const rs = (() => { const cnt = {}; c.tops.forEach(j => { cnt[HF[j]] = (cnt[HF[j]] || 0) + 1; }); return Object.entries(cnt).sort((a, b) => b[1] - a[1]); })();
    const reasonStable = rs.length === 1, rec = c.recourse, robust = rec && rec.honoured === 10;
    const tests = [
      ["The decision is stable", decStable, "the decision changes with the model", `Declined by ${deny} of 10 equally good models; predicted denial from ${fmt.pct(Math.min(...c.q))} to ${fmt.pct(Math.max(...c.q))}.`],
      ["The stated reason is stable", reasonStable, "the stated reason changes with the model", `Top reason: ${rs.map(([f, n]) => `${label(f).toLowerCase()} in ${n} of 10 models`).join("; ")}.`],
      ["There is a change the applicant could make", !!rec, "there is no change the applicant could make", rec ? `Lab A\u2019s search found: ${rec.changes.map(([f, a, b]) => `${label(f).toLowerCase()} ${fmt.n(a, 2)} \u2192 ${fmt.n(b, 2)}`).join(" and ")}.` : "No achievable change within the features an applicant could act on."],
      ["The change survives retraining", robust, rec ? "the change does not survive retraining" : null, rec ? `Accepted by ${rec.honoured} of 10 equally good models (predicted denial afterwards ${fmt.pct(rec.after_min)} to ${fmt.pct(rec.after_max)}).` : "Not applicable: there is no change to test."],
    ];
    const g = c.group, o = 1 - g;
    body.append(h("h2", null, "The evidence"), h("div", { class: "cards" },
      tests.map(([t, ok, , txt2]) => card(t, `<p>${txt2}</p>`, ok ? "pass" : "fail")),
      card("The fairness criterion is named", `<p>At the 0.50 rule, sufficiency holds (PPV ${fmt.n(M0[g].PPV, 3)} for this group against ${fmt.n(M0[o].PPV, 3)}) and separation fails: applicants from this group whom the bank historically approved are wrongly declined at a rate of ${fmt.pct(M0[g].FPR, 1)}, against ${fmt.pct(M0[o].FPR, 1)}. That is a choice, and it has to be stated.</p>`)));
    const fails = tests.filter(t => !t[1] && t[2]).map(t => t[2]), nFail = tests.filter(t => !t[1]).length;
    const verdict = nFail ? `This decision fails ${nFail} of 4 checkable tests: ${fails.join("; ")}${rec ? "" : ", so nothing can survive retraining either"}. As it stands, its explanation cannot be defended.` : "This decision passes all four checkable tests. What remains is the fairness criterion, which has to be stated and defended.";
    out.innerHTML = `You said you <b>${st.guess === 0 ? "would" : "would not"}</b> defend it. ${verdict} <br>An explanation is only worth what it can be defended with.`;
    body.append(out);
  }
  const sel = select({ label: "Declined applicant", value: String(st.pos), options: cases.map(c => [String(c.pos), `Applicant ${c.pos}: ${fmt.pct(c.p_ref)} predicted denial${c.surveyed ? "" : c.pos === D.rashomon.target ? ", the widest disagreement" : ", Lab B\u2019s recourse case"}`]),
    onchange: v => { st.pos = +v; st.guess = null; draw(); } });
  draw();
  return frame(m, {
    lede: "Every test so far examined one part of an explanation. Here they meet. Choose an applicant the lender declined, read the letter they would receive, decide whether you would stand behind it, and then look at the evidence.",
    instrument: h("div", { class: "instrument wide" }, h("div", { class: "controls", style: "max-width:30rem" }, sel.el), body),
    mathsHead: "What the tests add up to", mathsFold: "Show the summary",
    maths: "<p>Taken together, the tests describe what a defensible explanation needs. It states which model, data and comparison group it refers to (tests 1 to 3). It offers a change the applicant can make, of a size they could manage, that survives retraining (test 4). It does not rest on information the lender claims not to use (test 5). It names the fairness criterion chosen and the one given up (test 6). It holds when the explainer is not the only witness (test 7), and it does not depend on which of several equally good models happened to be deployed (test 8).</p>",
    lecture: "What a defensible explanation actually requires.", notebook: "Lab B, the closing stability and fairness report.",
  });
} });

boot();
</script>
